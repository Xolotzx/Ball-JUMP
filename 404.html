<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página não encontrada — Balljump-game</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#070b12; --bg2:#0d1420; --text:#eef3fa; --muted:#98a8bd;
    --line:rgba(255,255,255,.16); --glass:rgba(255,255,255,.07); --accent:#7dd3fc;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    font-family:"Segoe UI",system-ui,-apple-system,"Trebuchet MS",Roboto,sans-serif;
    color:var(--text);
    background:radial-gradient(700px 420px at 50% 0%,rgba(125,211,252,.12),transparent 65%),linear-gradient(180deg,var(--bg),var(--bg2));
  }
  main{
    width:min(100%,430px);padding:38px 28px;text-align:center;border-radius:26px;
    background:linear-gradient(155deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 30px 80px -44px rgba(0,0,0,.6);
    backdrop-filter:blur(24px) saturate(150%);
  }
  .code{display:block;font:800 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.24em;color:var(--accent);margin-bottom:10px}
  h1{margin:0;font-size:clamp(26px,7vw,34px);letter-spacing:-.04em;line-height:1.05}
  p{margin:10px 0 22px;color:var(--muted);font-size:13px;line-height:1.5}
  a{
    display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;
    border-radius:13px;text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.06em;
    color:#07131f;background:linear-gradient(155deg,#c7efff,var(--accent));
    border:1px solid rgba(255,255,255,.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  }
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (prefers-color-scheme:light){
    :root{color-scheme:light;--bg:#eef2f7;--bg2:#e3e9f1;--text:#192335;--muted:#60708a;--line:rgba(15,23,42,.12);--accent:#2563eb}
    main{background:linear-gradient(155deg,rgba(255,255,255,.85),rgba(255,255,255,.5));box-shadow:inset 0 1px 0 #fff,0 24px 60px -40px rgba(50,65,90,.35)}
    a{color:#fff;background:linear-gradient(155deg,#5b8cff,var(--accent));border-color:rgba(255,255,255,.6)}
  }
</style>
</head>
<body>
<main>
  <span class="code">404</span>
  <h1>Página não encontrada</h1>
  <p>O endereço não existe ou foi movido.</p>
  <a href="/">Voltar ao jogo</a>
</main>
</body>
</html>
