<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página não encontrada — Balljump-game</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#000000; --bg2:#0a0705; --text:#fff4e8; --muted:#c7a385;
    --line:rgba(255,170,90,.20); --glass:rgba(255,122,24,.07); --accent:#ff7a18;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    font-family:"Segoe UI",system-ui,-apple-system,"Trebuchet MS",Roboto,sans-serif;
    color:var(--text);position:relative;overflow:hidden;
    background:
      radial-gradient(46% 52% at 8% 108%,rgba(255,77,0,.75),transparent 70%),
      radial-gradient(48% 60% at 55% 116%,rgba(255,122,0,.62),transparent 72%),
      radial-gradient(38% 48% at 92% 102%,rgba(255,150,40,.5),transparent 70%),
      linear-gradient(180deg,var(--bg),var(--bg2));
  }
  body::after{
    content:"";position:fixed;inset:-10%;pointer-events:none;z-index:0;
    background:
      radial-gradient(38% 52% at 8% 108%,rgba(255,77,0,.8),transparent 70%),
      radial-gradient(48% 62% at 55% 116%,rgba(255,122,0,.7),transparent 72%);
    filter:blur(52px) saturate(140%);opacity:.6;
  }
  main{
    position:relative;z-index:1;
    width:min(100%,430px);padding:38px 28px;text-align:center;border-radius:26px;
    background:linear-gradient(155deg,rgba(255,214,170,.1),rgba(255,122,24,.03));
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,224,190,.3),0 30px 80px -44px rgba(0,0,0,.7);
    backdrop-filter:blur(24px) saturate(150%);
  }
  .code{display:block;font:800 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.24em;color:var(--accent);margin-bottom:10px}
  h1{margin:0;font-size:clamp(26px,7vw,34px);letter-spacing:-.04em;line-height:1.05}
  p{margin:10px 0 22px;color:var(--muted);font-size:13px;line-height:1.5}
  a{
    display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;
    border-radius:13px;text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.06em;
    color:#1d0d02;background:linear-gradient(155deg,#ffb066,var(--accent));
    border:1px solid rgba(255,255,255,.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  }
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (prefers-color-scheme:light){
    :root{color-scheme:light;--bg:#fffaf4;--bg2:#ffe9d6;--text:#2a1407;--muted:#7e5a42;--line:rgba(255,255,255,.85);--accent:#ea580c}
    body{background:
      radial-gradient(46% 52% at 8% 108%,rgba(255,94,0,.3),transparent 70%),
      radial-gradient(48% 60% at 55% 116%,rgba(255,138,40,.26),transparent 72%),
      radial-gradient(38% 48% at 92% 102%,rgba(255,170,80,.24),transparent 70%),
      linear-gradient(180deg,var(--bg),var(--bg2));}
    main{background:linear-gradient(155deg,rgba(255,255,255,.9),rgba(255,238,222,.62));box-shadow:inset 0 1px 0 #fff,0 24px 60px -40px rgba(120,60,20,.4)}
    a{color:#2a1407;background:linear-gradient(155deg,#ffb066,var(--accent));border-color:rgba(255,255,255,.7)}
  }
</style>
</head>
<body>
<main>
  <span class="code">404</span>
  <h1>Página não encontrada</h1>
  <p>O endereço não existe ou foi movido.</p>
  <a href="/">Voltar ao jogo</a>
</main>
</body>
</html>
